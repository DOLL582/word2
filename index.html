const STORE_KEY = "word-memory-v2";

function safeLoad(key){try{return JSON.parse(localStorage.getItem(key)||"null")}catch(e){return null}}
let state = safeLoad(STORE_KEY);
if(!state){
 const old=safeLoad(OLD_KEY);
 state={records:(old&&old.records)||{},settings:{dailyNew:20},daily:{date:localDate(),count:0}};
}
state.records=state.records||{};
state.settings=state.settings||{dailyNew:20};
state.daily=state.daily||{date:localDate(),count:0};
if(state.daily.date!==localDate())state.daily={date:localDate(),count:0};

function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));localStorage.setItem(OLD_KEY,JSON.stringify({records:state.records,settings:state.settings}));}catch(e){}}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function rec(id){return state.records[id]||(state.records[id]={seen:0,correct:0,wrong:0,box:0,next:0,last:0,firstSeen:0})}
function dueWords(){const now=Date.now();const due=WORDS.filter(w=>{const r=rec(w.id);return r.seen>0&&r.next<=now});const remaining=Math.max(0,(Number(state.settings.dailyNew)||20)-state.daily.count);const fresh=shuffle(WORDS.filter(w=>rec(w.id).seen===0)).slice(0,remaining);return [...due,...fresh]}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function pct(a,b){return b?Math.round(a/b*100):0}
function fmtInterval(ms){if(ms<3600000)return Math.max(1,Math.round(ms/60000))+" 分钟";const d=ms/86400000;return d<1?Math.round(ms/3600000)+" 小时":Math.round(d)+" 天"}

function sInterval(rating,r){
 if(rating==="again")return "10分钟后";if(rating==="hard")return "1天后";
 const day=Math.min(90,[1,3,7,14,30,60][Math.min(5,r.box)]||60);
 return rating==="easy"?(day*2)+"天后":day+"天后";
}
function reveal(){if(state.session){state.session.revealed=true;renderStudy()}}
function rateWord(rating){
 const s=state.session;if(!s)return;const w=s.word,r=rec(w.id),now=Date.now();
 if(r.seen===0){r.firstSeen=now;state.daily.count=Math.min(Number(state.settings.dailyNew)||20,state.daily.count+1);}
 r.seen++;r.last=now;
 if(rating==="again"){r.wrong++;r.box=0;r.next=now+10*60*1000;s.wrong++;}
 else{
  r.correct++;s.correct++;
  if(rating==="hard"){r.box=Math.max(1,r.box);r.next=now+86400000;}
  else if(rating==="good"){r.box=Math.min(6,r.box+1);const d=[1,3,7,14,30,60][r.box-1]||60;r.next=now+d*86400000;}
  else{r.box=Math.min(6,r.box+2);const d=[2,6,14,30,60,90][Math.min(5,r.box-1)]||90;r.next=now+d*86400000;}
 }
 save();s.i++;nextStudy();
}

  else if(kind==="unlearned")kmatch=r.seen===0;
  else if(kind==="weak")kmatch=r.seen>0&&pct(r.correct,r.correct+r.wrong)<60;
  return match&&dmatch&&kmatch;
 });
 const list=document.getElementById("wordList");if(!list)return;
 document.getElementById("matchCount").textContent=`显示 ${rows.length} 个词条`;
 list.innerHTML=rows.slice(0,180).map(w=>`<div class="wordrow"><div class="wordrowmain" onclick="showDetail(${w.id})"><div class="wordrowtitle">${esc(w.word)} ${w.triangleFocus?'<span class="tag orange">△重点</span>':''}</div><div class="wordrowmeaning">${esc(w.ipa||"")} · ${esc(w.meaning)}</div></div><div class="wordrowactions"><button class="btn small" onclick="speak('${esc(w.word)}')">🔊</button><button class="btn small" onclick="showDetail(${w.id})">详情</button></div></div>`).join("")+(rows.length>180?`<div class="listEmpty">为保持手机页面流畅，仅显示前 180 项。请继续搜索缩小范围。</div>`:"")||`<div class="listEmpty">没有找到匹配的词条。</div>`;
}
function showDetail(id){
 const w=WORDS.find(x=>x.id===id);if(!w)return;state.selected=id;nav("dict");
 document.getElementById("main").innerHTML=`<div class="card">
 <div class="topline"><button class="btn small" onclick="dictionary()">← 返回词库</button><span class="tag ${w.triangleFocus?"orange":"blue"}">${w.triangleFocus?"△ 三角重点词":esc(w.date)}</span></div>
 <div class="hero"><div class="word">${esc(w.word)}</div><div class="ipa">${esc(w.ipa||"音标未提供")}</div><button class="btn small" onclick="speak('${esc(w.word)}')">🔊 播放发音</button><div style="margin-top:10px"><span class="tag">${esc(w.pos||"词性未标")}</span><span class="tag">${esc(w.date)}</span></div><div class="meaning">${esc(w.meaning)}</div></div>
 ${w.note?`<div class="detailBlock"><div class="sectionLabel">原表备注</div><div class="detailText">${esc(w.note)}</div></div>`:""}
 <div class="detailBlock"><div class="sectionLabel">具体用法 / 使用环境</div><div class="detailText">${esc(w.usage||"本地尚未补充详细用法。请打开下方学习词典核对例句和语境。")}</div></div>
 ${w.collocation?`<div class="detailBlock"><div class="sectionLabel">常见搭配</div><div class="detailText">${esc(w.collocation)}</div></div>`:`<div class="detailBlock"><div class="sectionLabel">常见搭配</div><div class="detailText">原始表格未记录固定搭配；可通过 Cambridge / Oxford 链接查看该词的语料搭配和词典释义。</div></div>`}
 ${w.example?`<div class="detailBlock"><div class="sectionLabel">例句与翻译</div><div class="en">${esc(w.example)}</div><div class="zh">${esc(w.exampleZh)}</div></div>`:`<div class="detailBlock"><div class="sectionLabel">例句</div><div class="detailText">原始 Excel 未提供例句，为避免编造不自然的例句，本地词条保留原释义并提供在线权威词典链接。</div></div>`}
 ${w.similar?`<div class="detailBlock"><div class="sectionLabel">近义词 / 易混词辨析</div><div class="detailText">${esc(w.similar)}</div></div>`:`<div class="detailBlock"><div class="sectionLabel">近义词 / 易混词辨析</div><div class="detailText">旧词表没有附近义词对比。请使用下方词典链接核对相关词、语域和搭配；不要仅凭中文近义词互换。</div></div>`}
 <div class="detailBlock"><div class="sectionLabel">权威词典检索</div><div class="grid"><button class="btn" onclick="openDict(${w.id},'cambridge')">Cambridge Dictionary</button><button class="btn" onclick="openDict(${w.id},'oxford')">Oxford Learner's</button></div><div class="subtle" style="margin-top:8px">新增词的释义、搭配与例句为学习整理；词典链接可进一步核对国际音标、语音和具体语境。</div></div>
 <button class="btn primary" style="width:100%;margin-top:14px" onclick="startStudy(${w.id})">立即复习这个词</button>
 </div>`;
}
function openDict(id,source){const w=WORDS.find(x=>x.id===id);if(!w)return;const url=source==="cambridge"?w.dictionaryCambridge:w.dictionaryOxford;window.open(url,"_blank","noopener");}
function statistics(){
 state.session=null;nav("stats");
 const learned=WORDS.filter(w=>rec(w.id).seen>0),totalC=learned.reduce((a,w)=>a+rec(w.id).correct,0),totalW=learned.reduce((a,w)=>a+rec(w.id).wrong,0);
 const weak=learned.slice().sort((a,b)=>pct(rec(a.id).correct,rec(a.id).correct+rec(a.id).wrong)-pct(rec(b.id).correct,rec(b.id).correct+rec(b.id).wrong)).slice(0,8);
 document.getElementById("main").innerHTML=`<div class="card"><h2>学习统计</h2><div class="stats"><div class="stat"><strong>${learned.length}</strong><span>已学习</span></div><div class="stat"><strong>${WORDS.length-learned.length}</strong><span>未学习</span></div><div class="stat"><strong>${pct(totalC,totalC+totalW)}%</strong><span>答题正确率</span></div></div></div>
 <div class="card"><h3>薄弱词</h3>${weak.length?weak.map(w=>`<div class="wordrow"><div class="wordrowmain" onclick="showDetail(${w.id})"><div class="wordrowtitle">${esc(w.word)}</div><div class="wordrowmeaning">${esc(w.meaning)}</div></div><span class="tag">${pct(rec(w.id).correct,rec(w.id).correct+rec(w.id).wrong)}%</span></div>`).join(""):`<div class="subtle">完成几轮学习后，这里会显示薄弱词。</div>`}</div>
 <div class="card"><h3>复习设置</h3><label class="subtle" for="dailyNew">每天最多引入新词</label><select id="dailyNew" class="inputAnswer" onchange="setDailyNew(this.value)">${[10,20,30,40,50,80,100].map(n=>`<option ${Number(state.settings.dailyNew)===n?"selected":""} value="${n}">${n} 个</option>`).join("")}</select><div class="subtle">复习时间基于简化间隔重复算法；“忘了”会较快重现，连续答对后间隔逐渐拉长。</div></div>
 <div class="card"><h3>备份与迁移</h3><div class="grid"><button class="btn" onclick="exportProgress()">导出学习记录</button><button class="btn" onclick="document.getElementById('importFile').click()">导入学习记录</button></div><p class="subtle">学习记录保存在此浏览器/安装应用的数据空间。更换手机、清理浏览器数据或重新安装前，请先导出备份。词库本身内置于程序，无需导入。</p></div>
 <div class="card"><h3>词库统计</h3><div class="detailText">旧表：257 个词条（日期已校正）<br>照片三角重点词：130 个<br>总词条：387 个<br>其中三角重点词日期：10-07（37）、10-08（42）、10-09（51，含续页）。</div></div>`;
}
function setDailyNew(v){state.settings.dailyNew=Number(v)||20;state.daily.count=0;state.daily.date=localDate();save();statistics()}
function exportProgress(){
 const payload={version:2,exportedAt:new Date().toISOString(),records:state.records,settings:state.settings,daily:state.daily};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="word-memory-progress-backup.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importProgress(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||!obj.records)throw new Error("missing records");state.records={...state.records,...obj.records};if(obj.settings)state.settings={...state.settings,...obj.settings};save();alert("学习记录导入成功。");statistics();}catch(e){alert("文件格式无法识别，请选择本程序导出的 JSON 备份。");}event.target.value="";};reader.readAsText(file);
}
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
save();home();
</script>
</body></html>
